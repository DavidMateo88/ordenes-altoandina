<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de RRHH</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Formulario de login -->
    <div id="login-form">
      <h2>Iniciar Sesión (RRHH - Solo Gerentes)</h2>
      <form onsubmit="event.preventDefault(); login();">
        <div class="form-group">
          <label for="username">Usuario:</label>
          <input type="text" class="form-control" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </form>
    </div>

    <!-- Contenido de RRHH (oculto hasta login) -->
    <div id="rrhh-content" style="display: none;">
      <h1>Gestión de RRHH</h1>
      <button class="btn btn-secondary mb-3" onclick="logout()">Cerrar Sesión</button>

      <!-- Filtros de empleados -->
      <div class="mb-3">
        <h2>Empleados</h2>
        <label for="filter-rol">Filtrar por Rol:</label>
        <input type="text" id="filter-rol" class="form-control d-inline-block w-auto">
        <label for="filter-estado">Estado:</label>
        <select id="filter-estado" class="form-control d-inline-block w-auto">
          <option value="">Todos</option>
          <option value="activo">Activo</option>
          <option value="descanso">Descanso</option>
          <option value="licencia">Licencia</option>
          <option value="baja">Baja</option>
        </select>
        <label for="filter-proyecto">Proyecto:</label>
        <input type="text" id="filter-proyecto" class="form-control d-inline-block w-auto">
        <button class="btn btn-primary" onclick="loadEmpleados()">Filtrar</button>
        <button class="btn btn-success ml-2" onclick="exportEmpleadosToExcel()">Exportar a Excel</button>
        <button class="btn btn-info ml-2" onclick="exportEmpleadosToPDF()">Exportar a PDF</button>
      </div>

      <!-- Tabla de empleados -->
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Proyecto</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="empleados-body"></tbody>
      </table>
      <button class="btn btn-primary mb-3" id="add-empleado-btn">Agregar Empleado</button>

      <!-- Gráfico de empleados -->
      <div class="mb-3">
        <h3>Distribución de Empleados por Estado</h3>
        <canvas id="empleadosChart" style="max-height: 300px;"></canvas>
      </div>

      <!-- Filtros de rosters -->
      <div class="mb-3">
        <h2>Rosters</h2>
        <label for="filter-proyecto-roster">Filtrar por Proyecto:</label>
        <input type="text" id="filter-proyecto-roster" class="form-control d-inline-block w-auto">
        <button class="btn btn-primary" onclick="loadRosters()">Filtrar</button>
        <button class="btn btn-success ml-2" onclick="exportRostersToExcel()">Exportar a Excel</button>
        <button class="btn btn-info ml-2" onclick="exportRostersToPDF()">Exportar a PDF</button>
      </div>

      <!-- Tabla de rosters -->
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Fecha Inicio</th>
            <th>Fecha Fin</th>
            <th>Proyecto</th>
            <th>Empleados</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rosters-body"></tbody>
      </table>
      <button class="btn btn-primary mb-3" id="add-roster-btn">Crear Roster</button>

      <!-- Gráfico de rosters -->
      <div class="mb-3">
        <h3>Rosters por Proyecto</h3>
        <canvas id="rostersChart" style="max-height: 300px;"></canvas>
      </div>

      <!-- Modal para empleado -->
      <div class="modal fade" id="empleadoModal" tabindex="-1" aria-labelledby="empleadoModalTitle" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="empleadoModalTitle">Agregar Empleado</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form id="empleadoForm">
                <input type="hidden" id="empleadoId">
                <div class="form-group">
                  <label for="nombre">Nombre:</label>
                  <input type="text" class="form-control" id="nombre" required>
                </div>
                <div class="form-group">
                  <label for="apellido">Apellido:</label>
                  <input type="text" class="form-control" id="apellido" required>
                </div>
                <div class="form-group">
                  <label for="dni">DNI:</label>
                  <input type="text" class="form-control" id="dni" required>
                </div>
                <div class="form-group">
                  <label for="rol">Rol:</label>
                  <input type="text" class="form-control" id="rol" required>
                </div>
                <div class="form-group">
                  <label for="estado">Estado:</label>
                  <select class="form-control" id="estado" required>
                    <option value="activo">Activo</option>
                    <option value="descanso">Descanso</option>
                    <option value="licencia">Licencia</option>
                    <option value="baja">Baja</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="proyecto">Proyecto (opcional):</label>
                  <input type="text" class="form-control" id="proyecto">
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
              <button type="button" class="btn btn-primary" onclick="saveEmpleado()">Guardar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal para licencia -->
      <div class="modal fade" id="licenciaModal" tabindex="-1" aria-labelledby="licenciaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="licenciaModalLabel">Agregar Licencia</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form id="licenciaForm">
                <input type="hidden" id="licenciaEmpleadoId">
                <div class="form-group">
                  <label for="tipo">Tipo de Licencia:</label>
                  <select class="form-control" id="tipo" required>
                    <option value="médica">Médica</option>
                    <option value="vacaciones">Vacaciones</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="fecha_inicio">Fecha Inicio:</label>
                  <input type="date" class="form-control" id="fecha_inicio" required>
                </div>
                <div class="form-group">
                  <label for="fecha_fin">Fecha Fin:</label>
                  <input type="date" class="form-control" id="fecha_fin" required>
                </div>
                <div class="form-group">
                  <label for="comentarios">Comentarios (opcional):</label>
                  <textarea class="form-control" id="comentarios"></textarea>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
              <button type="button" class="btn btn-primary" onclick="saveLicencia()">Guardar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal para roster -->
      <div class="modal fade" id="rosterModal" tabindex="-1" aria-labelledby="rosterModalTitle" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="rosterModalTitle">Crear Roster</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form id="rosterForm">
                <input type="hidden" id="rosterId">
                <div class="form-group">
                  <label for="rosterNombre">Nombre:</label>
                  <input type="text" class="form-control" id="rosterNombre" required>
                </div>
                <div class="form-group">
                  <label for="rosterFechaInicio">Fecha Inicio:</label>
                  <input type="date" class="form-control" id="rosterFechaInicio" required>
                </div>
                <div class="form-group">
                  <label for="rosterFechaFin">Fecha Fin:</label>
                  <input type="date" class="form-control" id="rosterFechaFin" required>
                </div>
                <div class="form-group">
                  <label for="rosterProyecto">Proyecto (opcional):</label>
                  <input type="text" class="form-control" id="rosterProyecto">
                </div>
                <div class="form-group">
                  <label for="rosterEmpleados">Empleados:</label>
                  <select multiple class="form-control selectpicker" id="rosterEmpleados" data-live-search="true" title="Selecciona empleados"></select>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
              <button type="button" class="btn btn-primary" onclick="saveRoster()">Guardar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencias -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="rrhh.js"></script>
</body>
</html>
